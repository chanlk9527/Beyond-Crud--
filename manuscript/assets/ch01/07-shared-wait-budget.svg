<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">多个步骤共享同一个三秒等待预算</title>
  <desc id="desc">在同一进程的单调时钟上开始三秒预算。数据库消耗一秒，远端调用最多只可继续等待剩余两秒，而不是再获得三秒。图中右段是允许等待的剩余预算，不表示远端实际执行耗时。示例忽略其他开销。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="290" fill="#fff"/>
  <text x="28" y="30" text-anchor="start">同一进程、同一单调时钟：总预算 3 秒</text>
  <text x="90" y="64" text-anchor="middle">0 秒</text>
  <text x="280" y="64" text-anchor="middle">1 秒</text>
  <text x="660" y="64" text-anchor="middle">3 秒</text>
  <path class="arrow" d="M 90 78 H 695"/>
  <path class="line" d="M 90 70 V 86 M 280 70 V 86 M 660 70 V 86"/>
  <rect class="box" x="90" y="98" width="190" height="72" rx="4"/>
  <text x="185" y="126" text-anchor="middle">数据库已用</text>
  <text x="185" y="152" text-anchor="middle">1 秒</text>
  <rect class="box" x="280" y="98" width="380" height="72" rx="4"/>
  <text x="470" y="126" text-anchor="middle">远端最多继续等待</text>
  <text x="470" y="152" text-anchor="middle">剩余 2 秒</text>
  <path class="guide" d="M 660 176 V 204"/>
  <text x="660" y="224" text-anchor="middle">共同截止</text>
  <text x="28" y="250" text-anchor="start">剩余为 0：不再启动下一步；不保证远端停止执行。</text>
  <text x="28" y="277" text-anchor="start">横向按本例秒数绘制；右段表示预算，忽略其他开销。</text>
</svg>
