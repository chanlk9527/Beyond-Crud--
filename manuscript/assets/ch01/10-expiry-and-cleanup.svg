<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">权限截止与后台状态更新是不同的时刻</title>
  <desc id="desc">北京时间四月一日零点会员到期，但后台批任务直到零点十分才更新状态。假设其他访问条件满足，新请求在零点起即被拒绝。批任务状态在此期间可能仍未更新，不能延长访问权限。横向不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="285" fill="#fff"/>
  <text x="28" y="30" text-anchor="start">北京时间 4 月 1 日：批任务晚跑 10 分钟</text>
  <text x="320" y="67" text-anchor="middle">00:00 到期</text>
  <text x="570" y="67" text-anchor="middle">00:10 更新状态</text>
  <path class="arrow" d="M 200 94 H 690"/>
  <path class="guide" d="M 320 103 V 240 M 570 103 V 240"/>
  <text x="28" y="166" text-anchor="start">新请求授权</text>
  <rect class="box" x="200" y="140" width="120" height="40"/><rect class="box" x="320" y="140" width="350" height="40"/>
  <text x="260" y="166" text-anchor="middle">可访问</text>
  <text x="495" y="166" text-anchor="middle">拒绝新访问</text>
  <text x="28" y="226" text-anchor="start">批任务状态</text>
  <rect class="box" x="200" y="200" width="370" height="40"/><rect class="box" x="570" y="200" width="100" height="40"/>
  <text x="385" y="226" text-anchor="middle">可能仍未更新</text>
  <text x="620" y="226" text-anchor="middle">已更新</text>
  <text x="28" y="273" text-anchor="start">状态更新晚于权限截止，不自动延长有效期；横向不按比例</text>
</svg>
