<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">改期后识别旧版本的提醒</title>
  <desc id="desc">时间从上向下。课程服务将当前计划版本从三改为四并排入新提醒。旧提醒仍可能被队列交给执行器；执行器读取当前版本四，与任务版本三比较后跳过。图中未表示原子性保证，并发发送控制需另行设计。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222} .box{fill:#fff;stroke:#222;stroke-width:2} .line{fill:none;stroke:#222;stroke-width:2} .arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)} .guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="370" fill="#fff"/>
  <rect class="box" x="25" y="16" width="170" height="48" rx="4"/>
  <rect class="box" x="275" y="16" width="170" height="48" rx="4"/>
  <rect class="box" x="525" y="16" width="170" height="48" rx="4"/>
  <text x="110" y="46" text-anchor="middle">课程服务</text>
  <text x="360" y="46" text-anchor="middle">提醒队列</text>
  <text x="610" y="46" text-anchor="middle">提醒执行器</text>
  <path class="guide" d="M 110 64 V 342 M 360 64 V 342 M 610 64 V 342"/>
  <rect x="19" y="88" width="182" height="28" fill="#fff"/>
  <text x="110" y="108" text-anchor="middle">改期：版本 3 → 4</text>
  <text x="235" y="141" text-anchor="middle">新提醒（版本 4）</text>
  <path class="arrow" d="M 110 151 H 360"/>
  <text x="485" y="187" text-anchor="middle">旧提醒（版本 3）</text>
  <path class="arrow" d="M 360 197 H 610"/>
  <text x="360" y="233" text-anchor="middle">发送前读取当前计划版本</text>
  <path class="arrow" d="M 610 243 H 110"/>
  <text x="360" y="279" text-anchor="middle">返回当前版本 4</text>
  <path class="arrow" d="M 110 289 H 610"/>
  <rect class="box" x="483" y="313" width="215" height="42" rx="4"/>
  <text x="590" y="340" text-anchor="middle">3 ≠ 4：跳过旧提醒</text>
</svg>
