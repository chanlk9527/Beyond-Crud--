<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">当地预约时间的三种解析结果</title>
  <desc id="desc">当地日期时间和地区时区一起查询有效偏移量。零个说明时间不存在，拒绝重选；一个说明时间唯一；两个说明重复，必须选择候选。选择的偏移量通过有效性检查后才能得到唯一时间点。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222} .box{fill:#fff;stroke:#222;stroke-width:2} .line{fill:none;stroke:#222;stroke-width:2} .arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)} .guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="400" fill="#fff"/>
  <rect class="box" x="155" y="16" width="410" height="48" rx="4"/>
  <text x="360" y="46" text-anchor="middle">当地日期时间 ＋ 地区时区</text>
  <path class="arrow" d="M 360 64 V 91"/>
  <rect class="box" x="205" y="92" width="310" height="48" rx="4"/>
  <text x="360" y="122" text-anchor="middle">查询有效偏移量</text>
  <path class="arrow" d="M 360 140 V 164 H 125 V 190"/>
  <path class="arrow" d="M 360 140 V 190"/>
  <path class="arrow" d="M 360 140 V 164 H 595 V 190"/>
  <rect class="box" x="20" y="192" width="210" height="90" rx="4"/>
  <text x="125" y="244" text-anchor="middle">拒绝该预约</text>
  <text x="125" y="270" text-anchor="middle">请用户重新选时间</text>
  <rect class="box" x="255" y="192" width="210" height="90" rx="4"/>
  <text x="360" y="244" text-anchor="middle">采用唯一候选</text>
  <text x="360" y="270" text-anchor="middle">校验提交的偏移量</text>
  <rect class="box" x="490" y="192" width="210" height="90" rx="4"/>
  <text x="595" y="244" text-anchor="middle">必须选择一个候选</text>
  <text x="595" y="270" text-anchor="middle">校验提交的偏移量</text>
  <text x="125" y="216" text-anchor="middle">0 个：缺口</text>
  <text x="360" y="216" text-anchor="middle">1 个：唯一</text>
  <text x="595" y="216" text-anchor="middle">2 个：重叠</text>
  <path class="arrow" d="M 360 282 V 327"/>
  <path class="arrow" d="M 595 282 V 303 H 450 V 327"/>
  <rect class="box" x="255" y="328" width="310" height="48" rx="4"/>
  <text x="410" y="358" text-anchor="middle">校验通过 → 唯一时间点</text>
</svg>
