<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">按北京时间划分的业务日与 UTC 查询区间</title>
  <desc id="desc">北京时间二〇二七年三月三十一日零点到四月一日零点，对应 UTC 三月三十日十六点到三月三十一日十六点。上下端点一一对应，都使用包含起点、不包含终点的区间；本图不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222} .box{fill:#fff;stroke:#222;stroke-width:2} .line{fill:none;stroke:#222;stroke-width:2} .arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)} .guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="290" fill="#fff"/>
  <text x="28" y="34">业务日：2027-03-31（北京时间）</text>
  <text x="155" y="78" text-anchor="middle">03-31 00:00 +08:00</text>
  <text x="565" y="78" text-anchor="middle">04-01 00:00 +08:00</text>
  <path class="arrow" d="M 130 108 H 670"/>
  <path d="M 155 108 H 565" stroke="#222" stroke-width="6"/>
  <circle cx="155" cy="108" r="6" fill="#222"/>
  <circle cx="565" cy="108" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <path class="arrow" d="M 155 121 V 169"/>
  <path class="arrow" d="M 565 121 V 169"/>
  <text x="360" y="151" text-anchor="middle">分别换算两个日界</text>
  <path class="arrow" d="M 130 188 H 670"/>
  <path d="M 155 188 H 565" stroke="#222" stroke-width="6"/>
  <circle cx="155" cy="188" r="6" fill="#222"/>
  <circle cx="565" cy="188" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="155" y="224" text-anchor="middle">03-30 16:00Z（start）</text>
  <text x="565" y="224" text-anchor="middle">03-31 16:00Z（end）</text>
  <text x="28" y="269">查询条件：paid_at ≥ start 且 paid_at &lt; end；横向不按比例</text>
</svg>
