<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">应用、驱动、数据库与协议共同决定时间往返</title>
  <desc id="desc">一条示例往返测试链：应用时间对象经驱动参数绑定写入数据库，再经驱动读取、接口序列化和重新解析得到对象。各环节分别可能影响类型、会话时区、格式和精度。最终比较原对象和结果的时间语义，不只看数据库客户端显示。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="345" fill="#fff"/>
  <text x="28" y="32" text-anchor="start">从应用对象出发，检查完整往返</text>
  <rect class="box" x="25" y="60" width="200" height="72" rx="4"/>
  <text x="125" y="88" text-anchor="middle">应用时间对象</text>
  <text x="125" y="114" text-anchor="middle">语义类型与精度</text>
  <rect class="box" x="260" y="60" width="200" height="72" rx="4"/>
  <text x="360" y="88" text-anchor="middle">驱动参数绑定</text>
  <text x="360" y="114" text-anchor="middle">类型映射</text>
  <rect class="box" x="495" y="60" width="200" height="72" rx="4"/>
  <text x="595" y="88" text-anchor="middle">数据库存储</text>
  <text x="595" y="114" text-anchor="middle">列类型与会话时区</text>
  <path class="arrow" d="M 225 96 H 254"/>
  <path class="arrow" d="M 460 96 H 489"/>
  <path class="arrow" d="M 595 132 V 209"/>
  <text x="620" y="178" text-anchor="start">读取</text>
  <rect class="box" x="495" y="215" width="200" height="72" rx="4"/>
  <text x="595" y="243" text-anchor="middle">驱动读取对象</text>
  <text x="595" y="269" text-anchor="middle">类型与精度</text>
  <rect class="box" x="260" y="215" width="200" height="72" rx="4"/>
  <text x="360" y="243" text-anchor="middle">接口序列化</text>
  <text x="360" y="269" text-anchor="middle">格式与偏移量</text>
  <rect class="box" x="25" y="215" width="200" height="72" rx="4"/>
  <text x="125" y="243" text-anchor="middle">重新解析结果</text>
  <text x="125" y="269" text-anchor="middle">与原对象比较</text>
  <path class="arrow" d="M 495 251 H 466"/>
  <path class="arrow" d="M 260 251 H 231"/>
  <text x="28" y="330" text-anchor="start">比较时间点与约定精度，不只比较显示文本。</text>
</svg>
