<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">点击、资格检查与提交跨过截止时刻</title>
  <desc id="desc">示例以服务端资格检查时刻为准。请求甲截止后到达，检查时已过期；请求乙截止前检查通过，截止后提交成功，随后沿用保存的资格。保存失败不能返回受理成功。横向不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="310" fill="#fff"/>
  <text x="390" y="34" text-anchor="middle">截止瞬间</text>
  <path class="guide" d="M 390 48 V 230"/>
  <text x="28" y="112" text-anchor="start">请求甲</text>
  <text x="210" y="75" text-anchor="middle">客户端点击</text>
  <text x="485" y="75" text-anchor="middle">服务端到达</text>
  <path class="arrow" d="M 150 105 H 535"/>
  <circle cx="210" cy="105" r="5" fill="#222"/><circle cx="485" cy="105" r="5" fill="#222"/>
  <rect class="box" x="550" y="83" width="140" height="42" rx="4"/>
  <text x="620" y="111" text-anchor="middle">拒绝受理</text>
  <text x="28" y="207" text-anchor="start">请求乙</text>
  <text x="265" y="171" text-anchor="middle">资格检查通过</text>
  <text x="485" y="171" text-anchor="middle">数据库提交</text>
  <path class="arrow" d="M 150 200 H 535"/>
  <circle cx="265" cy="200" r="5" fill="#222"/><circle cx="485" cy="200" r="5" fill="#222"/>
  <rect class="box" x="550" y="178" width="140" height="42" rx="4"/>
  <text x="620" y="206" text-anchor="middle">继续完成</text>
  <text x="28" y="268" text-anchor="start">甲：截止后检查 → 拒绝；乙：截止前检查、提交成功 → 继续</text>
  <text x="28" y="295" text-anchor="start">虚线对齐截止边界；横向不按比例</text>
</svg>
