<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">相邻有效期共用一个排他边界</title>
  <desc id="desc">第一段在 starts_at 开始，包含起点，不包含 expires_at。第二段从同一个 expires_at 开始，包含该点。上海时间四月一日零点属于第二段。实心点表示包含，空心点表示不包含，横向不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222} .box{fill:#fff;stroke:#222;stroke-width:2} .line{fill:none;stroke:#222;stroke-width:2} .arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)} .guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="300" fill="#fff"/>
  <text x="28" y="36">第一段有效期</text>
  <text x="180" y="68" text-anchor="middle">starts_at</text>
  <text x="450" y="68" text-anchor="middle">expires_at</text>
  <path class="arrow" d="M 160 100 H 680"/>
  <path d="M 180 100 H 450" stroke="#222" stroke-width="6"/>
  <circle cx="180" cy="100" r="6" fill="#222"/>
  <circle cx="450" cy="100" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <path class="guide" d="M 450 113 V 147"/>
  <text x="28" y="156">续期后的第二段</text>
  <text x="450" y="180" text-anchor="middle">新的 starts_at</text>
  <path class="arrow" d="M 160 210 H 680"/>
  <path d="M 450 210 H 635" stroke="#222" stroke-width="6"/>
  <circle cx="450" cy="210" r="6" fill="#222"/>
  <circle cx="635" cy="210" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="450" y="246" text-anchor="middle">共同边界：上海时间 4 月 1 日 00:00</text>
  <text x="28" y="282">● 包含该点　○ 不包含该点；横向不按比例</text>
</svg>
