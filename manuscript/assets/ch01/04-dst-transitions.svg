<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">纽约夏令时缺口与重复时刻</title>
  <desc id="desc">纽约二〇二五年三月九日，当地钟表从一点五十九分五十九秒跳到三点，两点半不存在。十一月二日，第一次一点半带负四小时偏移，对应UTC五点半；第二次一点半带负五小时偏移，对应UTC六点半。UTC上的两个瞬间相差一小时。横向不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="350" fill="#fff"/>
  <text x="28" y="30" text-anchor="start">纽约 2025-03-09：春季跳时</text>
  <rect class="box" x="25" y="52" width="280" height="72" rx="4"/>
  <text x="165" y="80" text-anchor="middle">01:59:59（−05:00）</text>
  <text x="165" y="106" text-anchor="middle">跳时前</text>
  <rect class="box" x="415" y="52" width="280" height="72" rx="4"/>
  <text x="555" y="80" text-anchor="middle">03:00:00（−04:00）</text>
  <text x="555" y="106" text-anchor="middle">跳时后</text>
  <text x="360" y="76" text-anchor="middle">跳过</text>
  <path class="arrow" d="M 305 88 H 409"/>
  <text x="360" y="157" text-anchor="middle">02:30 不存在，没有对应瞬间</text>
  <text x="28" y="204" text-anchor="start">纽约 2025-11-02：秋季回拨</text>
  <rect class="box" x="25" y="222" width="280" height="72" rx="4"/>
  <text x="165" y="250" text-anchor="middle">第一次 01:30（−04:00）</text>
  <text x="165" y="276" text-anchor="middle">05:30Z</text>
  <rect class="box" x="415" y="222" width="280" height="72" rx="4"/>
  <text x="555" y="250" text-anchor="middle">第二次 01:30（−05:00）</text>
  <text x="555" y="276" text-anchor="middle">06:30Z</text>
  <text x="360" y="244" text-anchor="middle">1 小时</text>
  <path class="arrow" d="M 305 258 H 409"/>
  <text x="28" y="337" text-anchor="start">当地钟表可以跳过或重复；横向不按比例</text>
</svg>
