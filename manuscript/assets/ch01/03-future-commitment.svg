<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">时区规则更新影响两种不同的日程承诺</title>
  <desc id="desc">固定当地九点以本地输入为准，规则更新后重算执行时间点，当地九点保持，UTC可能改变。固定瞬间以确认的时间点为准，不随规则更新重算瞬间，UTC保持，当地显示可能改变。只是假设规则更新，不预测任何地区政策变化。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="315" fill="#fff"/>
  <text x="28" y="34" text-anchor="start">时区规则更新后，哪一个值应保持？</text>
  <rect class="box" x="25" y="70" width="200" height="72" rx="4"/>
  <text x="125" y="98" text-anchor="middle">固定当地九点</text>
  <text x="125" y="124" text-anchor="middle">本地输入为准</text>
  <rect class="box" x="260" y="70" width="200" height="72" rx="4"/>
  <text x="360" y="98" text-anchor="middle">按新规则重算</text>
  <text x="360" y="124" text-anchor="middle">执行时间点</text>
  <rect class="box" x="495" y="70" width="200" height="72" rx="4"/>
  <text x="595" y="98" text-anchor="middle">当地仍是九点</text>
  <text x="595" y="124" text-anchor="middle">UTC 可能改变</text>
  <path class="arrow" d="M 225 106 H 254"/>
  <path class="arrow" d="M 460 106 H 489"/>
  <rect class="box" x="25" y="190" width="200" height="72" rx="4"/>
  <text x="125" y="218" text-anchor="middle">固定瞬间</text>
  <text x="125" y="244" text-anchor="middle">确认时间点为准</text>
  <rect class="box" x="260" y="190" width="200" height="72" rx="4"/>
  <text x="360" y="218" text-anchor="middle">保持已确认的</text>
  <text x="360" y="244" text-anchor="middle">执行时间点</text>
  <rect class="box" x="495" y="190" width="200" height="72" rx="4"/>
  <text x="595" y="218" text-anchor="middle">UTC 保持不变</text>
  <text x="595" y="244" text-anchor="middle">当地显示可能变</text>
  <path class="arrow" d="M 225 226 H 254"/>
  <path class="arrow" d="M 460 226 H 489"/>
  <text x="28" y="300" text-anchor="start">这是两种业务承诺，不能在规则更新时临时互换。</text>
</svg>
