<svg xmlns="http://www.w3.org/2000/svg" width="720" height="335" viewBox="0 0 720 335" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">业务日期不变，晚到数据改变报表输入集合</title>
  <desc id="desc">按上海时间的支付发生日归属。支付在三月三十一日二十三点五十八分发生，四月一日零点十分回调入库。第一次收集截点零点零五分尚未看见该支付，第二次截点零点二十分能够看见。两次业务日期都为三月三十一日，但输入集合可以不同。横向不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="335" fill="#fff"/>
  <text x="28" y="30" text-anchor="start">同一业务日，两个数据收集截点</text>
  <text x="100" y="66" text-anchor="middle">支付发生</text>
  <text x="100" y="92" text-anchor="middle">03-31 23:58</text>
  <text x="270" y="66" text-anchor="middle">第一次截点</text>
  <text x="270" y="92" text-anchor="middle">04-01 00:05</text>
  <text x="440" y="66" text-anchor="middle">回调入库</text>
  <text x="440" y="92" text-anchor="middle">04-01 00:10</text>
  <text x="610" y="66" text-anchor="middle">第二次截点</text>
  <text x="610" y="92" text-anchor="middle">04-01 00:20</text>
  <path class="arrow" d="M 50 118 H 695"/>
  <circle cx="100" cy="118" r="5" fill="#222"/><circle cx="270" cy="118" r="5" fill="#222"/><circle cx="440" cy="118" r="5" fill="#222"/><circle cx="610" cy="118" r="5" fill="#222"/>
  <path class="arrow" d="M 270 129 V 168"/>
  <path class="arrow" d="M 610 129 V 168"/>
  <rect class="box" x="160" y="174" width="220" height="72" rx="4"/>
  <text x="270" y="202" text-anchor="middle">第一次输入集合</text>
  <text x="270" y="228" text-anchor="middle">尚无这笔支付</text>
  <rect class="box" x="490" y="174" width="220" height="72" rx="4"/>
  <text x="600" y="202" text-anchor="middle">补算输入集合</text>
  <text x="600" y="228" text-anchor="middle">已包含这笔支付</text>
  <text x="28" y="282" text-anchor="start">两次均归属 3 月 31 日；数据晚到，输入集合可变。</text>
  <text x="28" y="319" text-anchor="start">时刻均为上海时间；横向不按比例</text>
</svg>
