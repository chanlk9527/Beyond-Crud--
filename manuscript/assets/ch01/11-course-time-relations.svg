<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">课程计划与实际事件分别派生时间边界</title>
  <desc id="desc">已发布开课瞬间为二〇二七年七月十日UTC十三点。提醒为前二十四小时即七月九日十三点，报名截止为前两小时即七月十日十一点，北京展示为七月十日二十一点。录播截止独立从实际结束事件加七百二十小时计算，不能由计划结束替代。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4 L 0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.box{fill:#fff;stroke:#222;stroke-width:2}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="438" fill="#fff"/>
  <text x="28" y="30" text-anchor="start">发布计划：同一个已确认开课瞬间</text>
  <rect class="box" x="220" y="55" width="280" height="72" rx="4"/>
  <text x="360" y="83" text-anchor="middle">开课 starts_at</text>
  <text x="360" y="109" text-anchor="middle">2027-07-10 13:00Z</text>
  <path class="arrow" d="M 360 127 V 158 H 125 V 190"/>
  <path class="arrow" d="M 360 127 V 190"/>
  <path class="arrow" d="M 360 127 V 158 H 595 V 190"/>
  <rect class="box" x="20" y="197" width="210" height="72" rx="4"/>
  <text x="125" y="225" text-anchor="middle">提醒：开课前 24 小时</text>
  <text x="125" y="251" text-anchor="middle">07-09 13:00Z</text>
  <rect class="box" x="255" y="197" width="210" height="72" rx="4"/>
  <text x="360" y="225" text-anchor="middle">报名：开课前 2 小时</text>
  <text x="360" y="251" text-anchor="middle">07-10 11:00Z</text>
  <rect class="box" x="490" y="197" width="210" height="72" rx="4"/>
  <text x="595" y="225" text-anchor="middle">北京学员展示</text>
  <text x="595" y="251" text-anchor="middle">07-10 21:00 +08:00</text>
  <text x="28" y="316" text-anchor="start">已发生事实：以实际结束事件为起点</text>
  <rect class="box" x="70" y="335" width="250" height="72" rx="4"/>
  <text x="195" y="363" text-anchor="middle">实际结束事件</text>
  <text x="195" y="389" text-anchor="middle">服务端确认的结束时刻</text>
  <rect class="box" x="425" y="335" width="250" height="72" rx="4"/>
  <text x="550" y="363" text-anchor="middle">录播失效边界</text>
  <text x="550" y="389" text-anchor="middle">按实际结束计算</text>
  <text x="372" y="353" text-anchor="middle">＋720 小时</text>
  <path class="arrow" d="M 320 374 H 419"/>
  <text x="28" y="432" text-anchor="start">计划结束不能替代实际结束；图中日期均在 2027 年。</text>
</svg>
