<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">NTP 一次交换中的四个时钟读数</title>
  <desc id="desc">客户端在 t1 发送请求，服务端在 t2 接收并于 t3 响应，客户端在 t4 收到响应。时间向下推进，两个参与者使用各自的时钟。客户端总间隔扣除服务端处理间隔，得到去程与回程延迟之和；两段网络延迟不一定相等。纵向不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.line{fill:none;stroke:#222;stroke-width:2}.arrow{fill:none;stroke:#222;stroke-width:2;marker-end:url(#arrow)}.guide{stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="390" fill="#fff"/>
  <rect x="130" y="18" width="170" height="54" rx="3" fill="#fff" stroke="#222" stroke-width="2"/>
  <rect x="440" y="18" width="170" height="54" rx="3" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="215" y="52" text-anchor="middle">客户端时钟</text><text x="525" y="52" text-anchor="middle">服务端时钟</text>
  <path class="guide" d="M215 72 V325 M525 72 V325"/>
  <path class="arrow" d="M46 100 V310"/><text x="28" y="340">时间向下</text>
  <path class="arrow" d="M215 115 L525 175"/><path class="arrow" d="M525 225 L215 295"/>
  <g fill="#222"><circle cx="215" cy="115" r="4"/><circle cx="525" cy="175" r="4"/><circle cx="525" cy="225" r="4"/><circle cx="215" cy="295" r="4"/></g>
  <text x="198" y="110" text-anchor="end">t1 发送</text><text x="542" y="170">t2 接收</text>
  <text x="542" y="246">t3 发送</text><text x="198" y="310" text-anchor="end">t4 接收</text>
  <text x="370" y="125" text-anchor="middle">去程 d1</text><text x="370" y="245" text-anchor="middle">回程 d2</text>
  <path class="line" d="M205 115 H185 V295 H205 M535 175 H550 V225 H535"/>
  <text x="170" y="204" text-anchor="end">t4 − t1</text><text x="565" y="207">t3 − t2</text>
  <text x="360" y="347" text-anchor="middle">总往返间隔 − 服务端处理间隔 = d1 + d2</text>
  <text x="360" y="378" text-anchor="middle">两端各自读时钟；d1 与 d2 不一定相等；纵向不按比例</text>
</svg>
