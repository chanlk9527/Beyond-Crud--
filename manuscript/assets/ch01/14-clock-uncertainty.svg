<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">时钟误差区间与截止的三种关系</title>
  <desc id="desc">在误差上界确实成立时，实际时刻位于闭区间 c 减 epsilon 到 c 加 epsilon 中。区间最晚端早于截止 E 时可确定未到截止，区间跨越截止时无法确定，区间最早端等于或晚于截止时可确定已到截止。实心点包含端点，竖虚线对齐截止，横向不按比例。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8" fill="#222"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif;font-size:18px;fill:#222}.axis{fill:none;stroke:#555;stroke-width:2;marker-end:url(#arrow)}.range{stroke:#222;stroke-width:6}.guide{stroke:#555;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect width="720" height="390" fill="#fff"/>
  <text x="24" y="30">判断条件：实际时刻严格早于 E</text><text x="480" y="64" text-anchor="middle">截止 E</text>
  <path class="guide" d="M480 74 V255 M480 287 V310"/>
  <text x="24" y="117">确定早于截止</text><text x="24" y="147">c + ε &lt; E</text>
  <text x="24" y="207">无法确定</text><text x="24" y="237">区间跨过截止</text>
  <text x="24" y="297">确定已到截止</text><text x="24" y="327">c − ε ≥ E</text>
  <path class="axis" d="M220 115 H688"/><path class="axis" d="M220 205 H688"/><path class="axis" d="M220 295 H688"/>
  <path class="range" d="M270 115 H430 M400 205 H560 M480 295 H640"/>
  <g fill="#222"><circle cx="270" cy="115" r="6"/><circle cx="430" cy="115" r="6"/><circle cx="400" cy="205" r="6"/><circle cx="560" cy="205" r="6"/><circle cx="480" cy="295" r="6"/><circle cx="640" cy="295" r="6"/></g>
  <g text-anchor="middle"><text x="270" y="99">c − ε</text><text x="430" y="99">c + ε</text><text x="400" y="189">c − ε</text><text x="560" y="189">c + ε</text><text x="480" y="279">c − ε</text><text x="640" y="279">c + ε</text></g>
  <text x="240" y="328">第三行画出 c − ε = E，等号也已到截止</text>
  <text x="24" y="376">粗线：实际时刻的可能范围（含端点）；时间向右，横向不按比例</text>
</svg>
